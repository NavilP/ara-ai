[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "onboarding-env"
version = "1.0.0"
description = "HR onboarding coordinator RL environment — OpenEnv hackathon submission"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "httpx>=0.27,<1.0",
    "openai>=1.30,<2.0",
    "requests>=2.32,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "python-dotenv>=1.0,<2.0",
    "openenv-core>=0.2.0"
]

[project.urls]
Homepage = "https://huggingface.co/spaces"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "agent*"]